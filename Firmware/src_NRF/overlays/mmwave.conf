#
# Kconfig fragment for the COMBINED ExG + mmWave image. Merged on top of
# prj.conf by CMakeLists.txt whenever the radar is enabled -- normally by
# CONFIG_SENSOR_MMWAVE=y in prj.conf, which CMakeLists.txt scans for, or by
# forcing -DMMWAVE_SHIELD=ON.
#
# The radar shares SPI_A with the ADS1298 AFEs: the bus is switched to the
# radar's SPI mode 0 for the duration of each radar transaction and restored to
# the ADS1298's mode 1 afterwards, under spi_a_mutex (sensors/mmWave/mmWave_spi.c).
# EEG, EMG and WULPUS stay enabled from prj.conf and keep working.
#
# For a radar-only image that instead gives SPIM4 to the Zephyr SPI driver --
# the arrangement the standalone reference firmware uses, with no working ExG --
# configure with -DMMWAVE_ONLY=ON, which merges overlays/mmwave_only.conf.

# Enable the radar subsystem (see Kconfig for the option's sub-settings:
# register profile, 12-bit packing, test pattern, external sync).
#
# The radar always streams over BLE NUS (add_data_to_send_buffer()), so it works
# regardless of CONFIG_WI_FI. If the WiFi/SD shield is also enabled it becomes a
# third consumer of SPI_A alongside the ADS1298 and the radar; the bus mutex and
# the idle-wait in sensors/mmWave/mmWave_spi.c cover that, but that three-way
# combination has not been validated on hardware.
# Normally already set in prj.conf (that is what pulls this fragment in);
# repeated here so a forced -DMMWAVE_SHIELD=ON build works even if prj.conf has
# it turned off.
CONFIG_SENSOR_MMWAVE=y

# Report whether MISO ever came up if bring-up fails. Only runs on the failure
# path, so it costs nothing once the radar works.
CONFIG_MMWAVE_PROBE_LOOP=y

# The radar's IRQ and RST lines are the PDM microphone's DATA and CLK pins
# (P0.12 / P0.04). overlays/mmwave.overlay disables the PDM devicetree node,
# so drop the audio driver from the image as well. This is the one existing
# capability the radar displaces; ExG, IMU, PPG and WULPUS are unaffected.
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
CONFIG_AUDIO_DMIC_NRFX_PDM=n

#===============================================================================
# Deliberately NOT set here
#===============================================================================
#
# CONFIG_MMWAVE_SPI_STATIC_MODE=y
#   Pins SPI_A permanently in the radar's mode 0. That is a bring-up A/B test
#   only -- it stops the ADS1298 working, which defeats the point of this image.
#
# CONFIG_MMWAVE_ZEPHYR_SPI=y
#   Hands SPIM4 to the Zephyr SPI driver, which also stops the ADS1298 working.
#   Use -DMMWAVE_ONLY=ON if that is what you want.
#
# CONFIG_MMWAVE_SPI_FREQ_MHZ=1
#   Slows the radar clock to make transfers easy to capture on a logic
#   analyser. Leave at the default 8 for normal use; a slower clock holds the
#   shared bus longer and squeezes the ADS1298's sampling window.
