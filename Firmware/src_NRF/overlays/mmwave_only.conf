#
# Kconfig fragment for the RADAR-ONLY image. Merged on top of prj.conf by
# CMakeLists.txt when configuring with -DMMWAVE_ONLY=ON.
#
# This reproduces the transport of the standalone BGT60TR13C firmware that is
# known to work on this hardware: Zephyr's SPI driver owns SPIM4, the radar is
# the only device on the bus, and the bus is configured once from the
# devicetree rather than switched around every transaction.
#
# ExG does NOT work in this image. Zephyr's SPI driver and BioGAP's raw nrfx
# SPI_A layer cannot both own SPIM4, so init_spi_a_bus() becomes a no-op. The
# ADS1298 sources still compile and link -- they reference ExG-shield devicetree
# nodes that other unconditionally built files need -- but they must not be
# exercised. Do not send ExG start commands (opcodes 18/19/37/38) to this build.
#
# For the shared-bus image that keeps ExG working, use -DMMWAVE_SHIELD=ON
# instead, which merges overlays/mmwave.conf.

#===============================================================================
# Radar
#===============================================================================

CONFIG_SENSOR_MMWAVE=y

# Use the Zephyr SPI subsystem for the radar. Selects CONFIG_SPI, which makes
# Zephyr's driver bind &spi_a (SPIM4) and take it over from nrfx.
CONFIG_MMWAVE_ZEPHYR_SPI=y

# Report whether MISO ever came up if bring-up fails. Only runs on the failure
# path, so it costs nothing once the radar works.
CONFIG_MMWAVE_PROBE_LOOP=y

#===============================================================================
# Everything that would otherwise contend for SPI_A or the radar's pins
#===============================================================================

# ExG: shares SPI_A with the radar. The nrfx SPI_A layer is disabled in this
# build, so the ADS1298 cannot be driven.
CONFIG_SENSOR_EEG=n
CONFIG_SENSOR_EMG=n

# WULPUS: with CONFIG_SPI=y, Zephyr's driver also binds &spi_b (SPIM2), which
# the WULPUS bridge claims through nrfx. Same conflict, so leave it out.
CONFIG_SENSOR_WULPUS=n

# WiFi/SD shield: a third consumer of SPI_A.
CONFIG_WI_FI=n

# PPG and the dummy sensor are not needed here.
CONFIG_SENSOR_PPG_NEW=n
CONFIG_DUMMY_SENSOR=n

# The radar's IRQ and RST lines are the PDM microphone's DATA and CLK pins
# (P0.12 / P0.04). overlays/mmwave.overlay disables the PDM devicetree node, so
# drop the audio driver from the image as well.
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
CONFIG_AUDIO_DMIC_NRFX_PDM=n
