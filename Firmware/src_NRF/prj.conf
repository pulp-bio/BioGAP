#===============================================================================
# SENSEI SDK Configuration
#===============================================================================

CONFIG_SENSEI=y
CONFIG_SENSEI_PWR=y

#===============================================================================
# Core System Configuration
#===============================================================================

# System Resources
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# State Machine Framework
CONFIG_SMF=y

# State Machine Behavior
# Use k_cpu_idle() for responsiveness or k_sleep() for power efficiency
# CONFIG_STATE_MACHINE_USE_CPU_IDLE=y

# Reboot Support
CONFIG_REBOOT=y

#===============================================================================
# Hardware Drivers
#===============================================================================

# Basic Peripherals
CONFIG_LED=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_NFCT_PINS_AS_GPIOS=y

# SPI Configuration (raw nrfx drivers; pins match the board DTS pinctrl)
# SPIM4 = SPI_A (ADS1298, high-speed instance), SPIM2 = SPI_B (WULPUS)
CONFIG_NRFX_SPIM4=y
CONFIG_NRFX_SPIM2=y
# CONFIG_SPI=y

#===============================================================================
# Sensor Subsystems (one image for all shields)
#===============================================================================
CONFIG_SENSOR_WULPUS=y
# EEG and EMG are both enabled; the mode (unipolar vs bipolar ADS rails) is
# selected at runtime by the GUI start command (opcodes 18 vs 37).
# Simultaneous EEG+EMG streaming is rejected at runtime.
CONFIG_SENSOR_EEG=n
CONFIG_SENSOR_EMG=y

# Diagnostic sweep to locate PMIC-measurement noise injection into ExG:
# enable, flash, stream EEG/EMG and correlate noise bursts with the phase
# schedule (documented in bsp/pmic_noise_test.c, logged on the console).
# Disable again for production builds.
# CONFIG_PMIC_NOISE_TEST=y

# WiFi/SD shield (ESP32-C6) as the streaming transport instead of BLE.
# Shares SPI_A (SPIM4, already enabled above) with the ADS1298.
CONFIG_WI_FI=y

# Sensor Support
CONFIG_SENSOR=y

#===============================================================================
# Debug and Logging
#===============================================================================

# Debug Settings
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# Thread stack diagnostics: lets z_fatal_error() (main.c) walk every thread
# and report each one's name and remaining stack headroom at crash time --
# useful because the CPU exception frame itself can come back corrupted on
# a real stack overflow ("context area not valid"), so the fault dump's own
# registers/PC are not trustworthy, but this doesn't depend on that frame at
# all: it reads each thread's own (separate) stack-object metadata.
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# SEGGER RTT Configuration
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=1024

# Logging Backend
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

#===============================================================================
# Bootloader
#===============================================================================

# MCUboot (note: may complicate RTT debugging)
CONFIG_BOOTLOADER_MCUBOOT=y

#===============================================================================
# Bluetooth Configuration
#===============================================================================

# Core Bluetooth Stack
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BIOGAPULTRA"
#CONFIG_BT_DEVICE_NAME="WULPUS_PROBE_3"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Bluetooth Services
CONFIG_BT_NUS=y
CONFIG_BT_NSMS=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_THROUGHPUT=y

# HCI Configuration
CONFIG_BT_HCI=y
CONFIG_BT_HCI_IPC=y
CONFIG_NCS_INCLUDE_RPMSG_CHILD_IMAGE=y

# PHY and Data Length
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# Connection Parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=5
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Buffer Configuration
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# Alternative Buffer Sizes (disabled)
# CONFIG_BT_BUF_ACL_RX_SIZE=502
# CONFIG_BT_BUF_ACL_TX_SIZE=502
# CONFIG_BT_L2CAP_TX_MTU=498

# DK Library (for nRF development kit features)
CONFIG_DK_LIBRARY=y

#===============================================================================
# Audio/Microphone Configuration
#===============================================================================

CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y

#===============================================================================
# Scheduler Configuration (disabled)
#===============================================================================

# CONFIG_TIMESLICING=y
# CONFIG_TIMESLICE_SIZE=1
# CONFIG_TIMESLICE_PRIORITY=0

#===============================================================================
# Multi-PPG Sensor Configuration (MAXM86161 × N via TCA9548A MUX)
#===============================================================================

CONFIG_SENSOR_PPG_NEW=n

# Bitmask of enabled MUX channels (bit N = channel N).
# 0x01 = one sensor on channel 0; 0xFF = all eight sensors.
CONFIG_PPG_SENSOR_MASK=0x01

# Sample rate: 125, 250, or 500 sps.
CONFIG_PPG_SAMPLE_RATE=125


#===============================================================================
# Dummy Sensor Configuration (for testing without real sensors)
#===============================================================================
CONFIG_DUMMY_SENSOR=n

#===============================================================================
# mmWave Radar (Infineon BGT60TR13C, SENSEI mmWave shield)
#===============================================================================
# Compiling the radar in does not power it. The shield's rail and the radar
# itself stay off until the host sends TURN_ON_MMWAVE (opcode 48), so an image
# with this enabled behaves like one without it until the GUI actually asks for
# radar data -- which sensors run is decided by the start command.
#
# CMakeLists.txt scans this file for the option below and pulls in the two
# pieces Kconfig cannot provide, because they are resolved before Kconfig is
# evaluated: the SENSEI_mmWaveShield definition (which declares the bgt60
# devicetree node) and overlays/mmwave.overlay.
#
# Trade-off: the radar's RST and IRQ lines are the PDM microphone's CLK and DATA
# pins (P0.04 / P0.12), so enabling the radar disables the microphone.
# Everything else -- ExG, IMU, PPG, WULPUS -- keeps working, the radar sharing
# SPI_A with the ADS1298. Set this to n to get the microphone back.
CONFIG_SENSOR_MMWAVE=n

# Radar sub-options (register profile, SPI clock, 12-bit packing, test pattern,
# external sync, bring-up diagnostics) live in overlays/mmwave.conf, which is
# merged after this file. They sit behind "if SENSOR_MMWAVE" in Kconfig, so an
# assignment placed above the line that enables it would be dropped with an
# unmet-dependency warning.


#===============================================================================
# GAP9 coprocessor power-up (main.c gates gap9_pwr() behind this so boards
# without GAP9 populated can skip it at boot)
#===============================================================================
CONFIG_GAP9=n
